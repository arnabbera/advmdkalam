name: Link Public Service page
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/link-public-service.yml'
permissions:
  contents: write
jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Public Service navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="#social">Public Service</a>'
          new = '<a href="public-service.html">Public Service</a>'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('Public Service navigation link not found')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Connect Public Service menu to standalone page'
          git push
